<div class="form-container">
    <form class="form" (ngSubmit)="onSubmit()">
        <div class="form-header">
            <h1>Sign <span>in</span></h1>
        </div>
        <div class="form-body">
            <div class="form-input">
                <label for="username">Username</label>
                <input type="name" id="username"[(ngModel)]="username" name="username" class="form-control" placeholder="Enter your Username" autocomplete="off">
                <i class='bx bxs-user'></i>
                <span *ngIf="validate" class="validate">Enter Your UserName </span>
            </div>
            <div class="form-input">
                <label for="password">Password</label>
                <input type="password" id="password" [(ngModel)]="userPassword" name="userPassword" class="form-control" placeholder="Enter your Password" autocomplete="off">
                <i class='bx bxs-lock-alt'></i>
                <span *ngIf="validate" class="validate">Enter Your Password </span>
            </div>
            <div class="form-input">
                <button class="btn btn-primary">Login</button>
            </div>
        </div>
        <div class="form-footer">
            <i class='bx bxl-instagram'></i>
            <i class='bx bxl-facebook-circle'></i>
            <i class='bx bxl-linkedin-square'></i>
        </div>
    </form>
</div>
